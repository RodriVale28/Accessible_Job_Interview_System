# S1-4.3 Render Blueprint - owner: Valeria Rodriguez Hernandez
# Render -> New -> Blueprint -> pick this repo. Creates:
#   interview-studio-api  FastAPI backend
#   interview-studio-web  Next.js front end (forwards /api/* to the backend)
# DATABASE_URL is the Supabase Session pooler URI, entered in the Render dashboard (never committed).
# Render's free PostgreSQL is not used: it is deleted 30 days after creation.
services:
  - type: web
    name: interview-studio-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL         # Supabase -> Connect -> Session pooler URI
        sync: false

  - type: web
    name: interview-studio-web
    runtime: node
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_ORIGIN            # the backend's public URL, e.g. https://interview-studio-api.onrender.com
        sync: false
