# Render config for Interview Studio staging.
# Secrets (sync: false) are typed in the Render dashboard, never saved here.
services:
  # Flask: Runs the Python app. 
  - type: web
    name: interview-studio-api
    runtime: python
    plan: free
    rootDir: .                  # folder that holds requirements.txt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT   
    healthCheckPath: /          # keep off the database
    autoDeploy: true   # redeploys on every push to the branch
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_DEBUG     # config.py defaults debug ON, so force it off
        value: "0"
      - key: LLM_MODEL         # the model to use for the interview questions
        value: gpt-4o-mini
      - key: DATABASE_URL        # Supabase connection string (pooler URI)
        sync: false
      - key: SUPABASE_URL     # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY          # publishable (or anon) key
        sync: false
      - key: SECRET_KEY              # Flask session signing; Render generates a random value
        generateValue: true
      - key: OPENAI_API_KEY        # your OpenAI key (secret, entered in the dashboard)
        sync: false

  # ---------- Next.js frontend ----------
  - type: web
    name: interview-studio-web
    runtime: node
    plan: free
    rootDir: frontend           # change to your Next.js folder
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION   # Node version to use for the frontend
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL       # the backend URL for the frontend to call
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL  # same Project URL as the backend
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY        # same publishable/anon key (designed to be public)
        sync: false