# Render config for Interview Studio staging.
# Secrets (sync: false) are typed in the Render dashboard, never saved here.
services:
  # FastAPI backend
  - type: web
    name: interview-studio-api
    runtime: python
    plan: free
    rootDir: backend            # folder that holds requirements.txt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health    # keep off the database
    autoDeploy: true   # redeploys on every push to the branch
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL        # Supabase connection string (pooler URI)
        sync: false
      - key: SUPABASE_URL     # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY          # publishable (or anon) key
        sync: false
      - key: AI_ENABLED        # 0 turns ALL AI off; keyword grading takes over
        value: "1"
      - key: AI_BASE_URL       # Gemini's OpenAI-compatible endpoint
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL         # current Flash-Lite model name from Google AI Studio
        value: gemini-3.5-flash-lite
      - key: AI_TIMEOUT_SECONDS
        value: "10"

  # ---------- Next.js frontend ----------
  - type: web
    name: interview-studio-web
    runtime: node
    plan: free
    rootDir: frontend           # change to your Next.js folder
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION   # Node version to use for the frontend
        value: 20.18.0
      - key: API_ORIGIN       # the backend URL; Next.js forwards /api/* to it (next.config.mjs)
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL  # same Project URL as the backend
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY        # same publishable/anon key (designed to be public)
        sync: false