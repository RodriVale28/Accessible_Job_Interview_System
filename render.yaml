# S1-4.3 Render Blueprint - owner: Valeria Rodriguez Hernandez
# Render -> New -> Blueprint -> pick this repo. Creates:
#   interview-studio-db   free PostgreSQL database (DATABASE_URL is filled in automatically)
#   interview-studio-api  FastAPI backend
#   interview-studio-web  Next.js front end (forwards /api/* to the backend)
# To use Supabase instead, replace DATABASE_URL on the api service with the Supabase Session pooler URI.
databases:
  - name: interview-studio-db
    plan: free
    region: ohio
    databaseName: interview_studio
    user: interview_studio

services:
  - type: web
    name: interview-studio-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: interview-studio-db
          property: connectionString

  - type: web
    name: interview-studio-web
    runtime: node
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_ORIGIN            # the backend's public URL, e.g. https://interview-studio-api.onrender.com
        sync: false
