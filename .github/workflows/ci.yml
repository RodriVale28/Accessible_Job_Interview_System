# S1-X.1 GitHub Actions CI — owner: Thunder Oyebi
# Save as .github/workflows/ci.yml in the repo.
name: CI

# [push, pull_request]
on:
  push:
    branches:
      - feature/S1-X.1-github_actions_ci
  pull_request:
    branches:
      - feature/S1-X.1-github_actions_ci

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # TODO: setup-python, pip install -r requirements.txt, run pytest
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
           python-version: ">=3.11"
      - run: pip install -r requirements.txt
      - run: pip install -U pytest
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      # TODO: setup-node, npm ci, npm run lint, npm run build, npm test
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
           python-version: ">=20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
