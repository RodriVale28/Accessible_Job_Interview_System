# S1-X.1 GitHub Actions CI - owner: Thunder Oyebi
# Runs on every push and pull request. A red check blocks the merge.
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Runs every API test twice: in-memory store and real PostgreSQL. Fails under 70% coverage.
      - run: pytest --cov=app --cov-report=term --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start backend (in-memory store)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and start front end
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > web.log 2>&1 &
          npx playwright install --with-deps chromium
          npx wait-on -t 60000 http://localhost:3000 http://localhost:8000/health
      - name: Playwright critical path (S1-5.4)
        working-directory: frontend
        run: npm run test:e2e
