# Save as .github/workflows/ci.yml in the repo.
name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python
        with:
           python-version: 3.11
      - run: pip install -r requirements.txt
